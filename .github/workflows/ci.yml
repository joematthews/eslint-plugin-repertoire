name: CI

# `pull_request` (NOT `pull_request_target`): for fork PRs the workflow runs with a read-only
# GITHUB_TOKEN and no access to repository secrets, so untrusted PR code cannot exfiltrate secrets
# or push to the repo. These checks need neither.
on:
  pull_request:
    branches: [main]

# Least privilege: the checks only read the code.
permissions:
  contents: read

# Cancel an in-progress run when the PR branch is updated again.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      HUSKY: "0" # no git hooks on a CI checkout
    steps:
      # Full history: the version-bump reminder below diffs against the base branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # `--ignore-scripts`: do not run install lifecycle scripts from the PR's package.json or its
      # dependencies on the runner. Everything below resolves its native binaries through
      # optionalDependencies, so this costs nothing and removes an arbitrary-code-execution path.
      - run: npm ci --ignore-scripts

      # Runs first: a type error makes every check below it unreliable, and neither ESLint nor
      # vitest reports one on its own.
      - name: Typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      # src/charsets.json is generated and committed. Regenerate it and fail if the result
      # differs, which catches a change to extract.ts or to CLDR that was never written back.
      - name: Generated files are current
        run: npm run check:generated

      - name: Tests and coverage
        run: npm run coverage

      # `files` ships dist/, which is gitignored, so a bundler failure would otherwise stay
      # invisible until publish.
      - name: Build
        run: npm run build

  # What a consumer does, on every Node the plugin claims to support and against the oldest
  # ESLint it claims to support. The tarball is built once on the development Node, then
  # installed and run on each supported one, so this measures the package rather than the
  # toolchain.
  #
  # eslint@9.15 is pinned deliberately: it is the peer floor, because the rule uses
  # meta.defaultOptions, which ESLint added in 9.15. If that floor is ever lowered without
  # changing the rule, this job is what notices.
  runtime:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18", "20", "22", "24"]
    name: runs on node ${{ matrix.node-version }}
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --ignore-scripts

      # `npm pack` runs prepack, which builds. The result is what `npm publish` would upload.
      - name: Pack
        run: npm pack --pack-destination /tmp

      # Switch to the Node under test. Nothing below this line touches the toolchain.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install the tarball beside the oldest supported ESLint
        run: |
          mkdir -p /tmp/consumer
          cd /tmp/consumer
          npm init -y > /dev/null
          npm pkg set type=module
          npm install eslint@9.15 /tmp/*.tgz

      # An em dash in a comment is what this rule exists to catch, so a clean run here would
      # mean the plugin loaded and did nothing. It has to be a comment: string literals are
      # deliberately exempt, being text a reader sees.
      #
      # The character is written by node rather than typed here, because this rule lints this
      # repository's own workflows and an em dash in the YAML would fail its own check.
      - name: The rule loads and reports
        run: |
          cd /tmp/consumer
          cat > eslint.config.mjs <<'CONFIG'
          import repertoire from "eslint-plugin-repertoire";
          export default [repertoire.configs.recommended];
          CONFIG
          node -e "require('fs').writeFileSync('sample.js', '// a dash \u2014 in a comment\nconst note = 1;\n')"
          if npx eslint sample.js; then
            echo "::error::the rule did not report an em dash on eslint 9.15"
            exit 1
          fi
          echo "reported as expected"

  # Advisory only, and once rather than per Node: a PR that changes shipped code without
  # bumping the version merges fine, it just will not publish.
  #
  # BASE_REF goes through `env` rather than being interpolated into the script. A branch name
  # is attacker-controlled on a fork PR, and `${{ github.base_ref }}` written directly into a
  # `run:` block is expanded before the shell sees it. As an environment variable the shell
  # treats it as a plain string. See GHSA-7x29-qqmq-v6qc.
  version-reminder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Version bump reminder
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git show "origin/$BASE_REF:package.json" > /tmp/base-package.json
          base=$(node -p "require('/tmp/base-package.json').version")
          head=$(node -p "require('./package.json').version")
          if [ "$base" = "$head" ] && ! git diff --quiet "origin/$BASE_REF...HEAD" -- src docs README.md; then
            echo "::warning::Shipped files changed but the version is still $head. Merging will not publish."
          fi
